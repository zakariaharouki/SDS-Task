name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    # Pinned because MongoDB 8.0 refuses to start on Linux kernels 6.19 to 7.0.13
    # (SERVER-121912, SERVER-125742), which breaks the Testcontainers tests.
    runs-on: ubuntu-24.04
    steps:
      - run: uname -r
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build backend/SchemeTracker.sln
      - run: dotnet test backend/SchemeTracker.sln --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
